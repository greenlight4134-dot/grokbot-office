<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GrokBot Office</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%224%22 y=%2214%22 width=%227%22 height=%2212%22 rx=%222%22 fill=%22%23ffb13d%22/%3E%3Crect x=%2213%22 y=%228%22 width=%227%22 height=%2218%22 rx=%222%22 fill=%22%23ff6a3d%22/%3E%3Crect x=%2222%22 y=%2212%22 width=%227%22 height=%2214%22 rx=%222%22 fill=%22%23ff8a3d%22/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body class="day">
  <canvas id="space"></canvas>
  <div id="planet"><div class="clouds"></div></div>
  <div id="stage"></div>
  <div id="labels"></div>

  <header id="topbar">
    <div class="brand">
      <div class="logo"><i></i><i></i><i></i></div>
      <div>
        <div class="title">GrokBot Office</div>
        <div class="subtitle"><span class="live-dot"></span><span id="crewline">— bots on deck</span></div>
      </div>
    </div>
    <div class="actions">
      <div class="seg" id="daynight">
        <button data-mode="day" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span data-i18n="day">Day</span></button>
        <button data-mode="night"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span data-i18n="night">Night</span></button>
      </div>
      <button class="chip" id="tasksBtn"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></svg><span data-i18n="tasks">Tasks</span><b class="badge" id="taskCount">0</b></button>
      <button class="chip needs hidden" id="needsBtn"><b class="badge red" id="needsCount">1</b><span data-i18n="needsYouLower">needs you</span></button>
      <div class="user" id="userBtn">
        <div class="avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/></svg></div>
        <div><div class="uname" id="uname">@user</div><div class="ustate"><span class="live-dot"></span><span data-i18n="connected">Connected</span></div></div>
        <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        <div class="menu hidden" id="userMenu">
          <div class="menu-h" data-i18n="crewPreset">Crew preset</div>
          <button data-preset="mine"><span class="mdot" style="background:#7b4dff"></span>내 팀 · 초탄 × 밈코인 레이더 (5)</button>
          <button data-preset="demo"><span class="mdot" style="background:#3ecfa6"></span>Demo crew (7 bots)</button>
          <div class="menu-sep"></div>
          <button id="menuAdd" data-i18n="addBot">Add a bot</button>
          <a href="/README.md" target="_blank" data-i18n="apiDocs">API docs</a>
        </div>
      </div>
    </div>
  </header>

  <aside id="crew" class="glass">
    <div class="crew-h"><span data-i18n="crew">CREW</span><span id="crewCount">0</span></div>
    <div id="crewList"></div>
    <div id="pipe" class="pipe hidden"></div>
  </aside>

  <section id="panel" class="glass hidden"></section>

  <div id="ticker"></div>
  <div id="toast" class="hidden"></div>
  <div id="tooltip" class="hidden"></div>

  <div id="zoom">
    <button id="zin" title="Zoom in">+</button>
    <button id="zout" title="Zoom out">−</button>
    <button id="zfull" title="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>

  <div id="modalWrap" class="hidden">
    <div id="modal" class="glass">
      <button class="x" id="modalClose">×</button>
      <div class="modal-icon"><i></i></div>
      <h2 data-i18n="addBot">Add a bot</h2>
      <p class="lead" id="modalLead"></p>
      <ol class="steps" id="modalSteps"></ol>
      <div class="modal-foot">
        <input id="newBotName" value="My bot" maxlength="40" />
        <button class="cyan" id="sendTest" data-i18n="sendTest">Send a test status</button>
      </div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
